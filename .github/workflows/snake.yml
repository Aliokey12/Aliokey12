GitHub'da görüntüle
Bir kullanıcının katkı grafiğini oluşturmak ve güncellemek için GitHub Actions'ı kullanır ve ardından bir yılanın tüm katkılarınızı yemesini sağlar. Çıktı, daha sonra GitHub Profile README'nizde gösterebileceğiniz bir gif dosyası oluşturur. Bunun oldukça havalı olduğunu düşündüm, bu yüzden bunu profilimde eklemeye koyuldum.

Adım 1. GitHub Actions'ı kurma
Bu projeye başlamadan önce emin olmak isteyeceğiniz ilk şey, GitHub Actions'ın kurulu olmasıdır. Profilinize gidin ve "Actions" sekmesinin kullanılabilir olduğundan emin olun. Artık herkes bu özelliğe sahip olmalı.

Eylemler Düğmesi

Sonra, Platane's Action'a (Marketplace'te mevcuttur) gidin ve kodun bir kopyasını oluşturun. Bu parçacığı Actions dosyanıza eklemeniz gerekecektir.

Adım 2. GitHub Actions yaml dosyanızı oluşturma
Kesinlikle takıldığım kısım burasıydı. Koda bakarken Marketplace'te belirtilen kod satırlarını tam olarak nereye ekleyeceğimden emin değildim .

Platane'in Actions dosyasının kurulumunu inceledikten sonra kodu üretebildim ( elbette Bdougie'nin de yardımıyla).

Aşağıya tam kod parçasını ekledim ve bolca yorum ekledim (umarım anlaşılması kolay olur).

Bu kodu doğrudan boş bir *.yml dosyasına kopyalayabilirsiniz. Aşağıdaki dizin altında yeni bir *.yml dosyası oluşturduğunuzdan emin olun:

YOUR_GITHUB_USERNAME --> .github --> iş akışları --> FILE_NAME.yml


# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

# Controls when the action will run. This action runs every 6 hours.

on:
  schedule:
      # every 6 hours
    - cron: "0 */6 * * *"

# This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:

# The sequence of runs in this workflow:
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    # Checks repo under $GITHUB_WORKSHOP, so your job can access it
      - uses: actions/checkout@v2

    # Generates the snake  
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: mishmanners
          # these next 2 lines generate the files on a branch called "output". This keeps the main branch from cluttering up.
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

     # show the status of the build. Makes it easier for debugging (if there's any issues).
      - run: git status

      # Push the changes
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          # the output branch we mentioned above
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
Adım 3. GitHub Actions'ı Çalıştırma
Yukarıdaki kodu ekledikten ve commit ettikten sonra Actions sekmenize gidin. "Workflows" altında, yukarıda oluşturduğunuz "Generate Snake" Action'ını görmelisiniz.

İş akışı

"İş Akışını Çalıştır"a tıklayın ve iş akışınızın çalışmasını izleyin. Hatta iş akışınızı genişletebilir ve gerçek zamanlı olarak neler olduğunu görebilirsiniz.

Çalışan Eylemler

İş akışınız çalışmayı bitirdiğinde, yeşil bir ✅ "oluştur" onay işareti almış olmalısınız. Eğer öyleyse, bu Action'ınızın düzgün çalıştığı anlamına gelir. Eğer değilse, kodu incelemeniz ve hataların nerede olduğunu görmeniz gerekir. "Oluşturma" durumu, hatalarınızın nerede olduğuna dair size bir fikir vermelidir. Ayrıca bunu GitHub Profile README'deki yaml dosyasıyla da karşılaştırabilirsiniz .

Yeşil inşa et

Yeşil "build" ✅'niz varsa, o zaman hazır olmalısınız. Deponuzun "Code" dizinine geri dönün ve dalınızı "output" olarak değiştirin. Burada, yılanın onu yediği katkı grafiğinizin iki versiyonunu bulacaksınız: bir *.gif ve bir *.svg. Bu dosyaların iyi yanı, Action her çalıştığında dosyanın kendi üzerine yeniden yazılmasıdır. Bu nedenle, katkı grafiğiniz her zaman güncel olacaktır.

KodÇıktısı

