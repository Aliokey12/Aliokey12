Şimdi son set bunu profilinize eklemektir. *.gif dosyanızın konumunu alın. Şuna benzer bir şey olmalı:

https://github.com/YOUR_USERNAME/YOUR_USERNAME/blob/output/github-contribution-grid-snake.gif

